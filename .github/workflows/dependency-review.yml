name: dependency-review

# Se corre también en push porque las ramas feature se integran localmente,
# sin pull request, y se suben directo a develop o main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # En pull_request se comparan la base y la cabeza del PR; en push, el commit anterior y el
          # nuevo. Pasar github.event.before (vacío en un PR) dejaba la action sin base y fallaba.
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate
