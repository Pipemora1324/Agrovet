name: mobile

on:
  push:
    branches: [main, develop, "feature/mobile-**"]
    paths: ["mobile/**", "ml/models/**", ".github/workflows/mobile.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["mobile/**", "ml/models/**", ".github/workflows/mobile.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: hashFiles('mobile/pubspec.yaml') != ''
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        if: hashFiles('mobile/pubspec.yaml') != ''
        with:
          channel: stable
          cache: true

      - name: Dependencias
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter pub get

      - name: Análisis estático
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter analyze

      - name: Pruebas
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter test

      - name: APK de prueba
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter build apk --debug

      - name: Sin código aún
        if: hashFiles('mobile/pubspec.yaml') == ''
        run: echo "El módulo mobile todavía no tiene código; nada que probar."
