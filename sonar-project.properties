# Análisis de SonarCloud (workflow .github/workflows/quality.yml). Un solo proyecto para los tres
# módulos; los informes de cobertura los generan los jobs de cobertura de ese workflow.
sonar.organization=pipemora1324
sonar.projectKey=Pipemora1324_Agrovet
sonar.projectName=AgroVet
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,mobile/lib,ml/src,scripts
sonar.tests=backend/src/test/java,mobile/test,mobile/integration_test,ml/tests
# Código generado por Drift y artefactos de compilación.
# Con el alcance nuevo de SonarCloud, sonar.sources, sonar.tests y sonar.test.inclusions no tienen efecto
# (lo dice el escáner) y las pruebas de Java y de Dart quedaban como código fuente: contaban como código
# sin cubrir y les aplicaban reglas de producción. Solo se respetan las exclusiones, así que se excluyen;
# siguen corriendo en el CI (Checkstyle y flutter analyze). Las de Python sí se reconocen como pruebas.
sonar.exclusions=**/*.g.dart,**/build/**,**/target/**,backend/src/test/**,mobile/test/**,mobile/integration_test/**
sonar.coverage.exclusions=**/*.g.dart,scripts/**

# Backend (Java 21): bytecode compilado, bibliotecas y JaCoCo
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.libraries=backend/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ml (Python 3.13): coverage.xml de pytest-cov
sonar.python.version=3.13
sonar.python.coverage.reportPaths=ml/coverage.xml

# mobile (Dart): lcov de flutter test --coverage, con rutas desde la raíz del repositorio
sonar.dart.lcov.reportPaths=mobile/coverage/lcov.info
