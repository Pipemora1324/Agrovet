# Todo lo sensible llega por variables de entorno (ver .env.example). No hay valores por defecto
# para credenciales ni para el secreto del JWT: si faltan, la aplicación no arranca.
spring:
  application:
    name: agrovet-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Un poco más que agrovet.photos.max-size, para que el mensaje claro lo dé la aplicación
      max-file-size: 6MB
      max-request-size: 6MB

server:
  error:
    include-message: never
    include-stacktrace: never

agrovet:
  jwt:
    secret: ${JWT_SECRET}
    issuer: agrovet
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P14D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  login-rate-limit:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window: ${LOGIN_WINDOW:PT5M}
    max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:30}
  # Correo saliente (códigos de verificación y de recuperación). Con MAIL_USERNAME y MAIL_PASSWORD
  # vacíos va a Mailpit; con valores, al SMTP real con STARTTLS (ver MailServerConfig).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    mailpit-host: ${MAILPIT_HOST:localhost}
    mailpit-port: ${MAILPIT_SMTP_PORT:1025}
    require-smtp: false
    # false solo en pruebas: el correo sale en el mismo hilo
    async: true
  # Asistente con IA. Sin GEMINI_API_KEY queda apagado (responde 503) y la app muestra consejos fijos.
  assistant:
    provider: ${ASSISTANT_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    base-url: https://generativelanguage.googleapis.com
    timeout: PT30S
    max-per-hour: ${ASSISTANT_MAX_PER_HOUR:20}
    max-per-day: ${ASSISTANT_MAX_PER_DAY:60}
  photos:
    storage-dir: ${PHOTO_STORAGE_DIR}
    max-size: 5MB
    max-dimension: 6000
  email-codes:
    ttl: PT15M
    max-attempts: 5
    resend-cooldown: PT60S
    max-per-day: 10
    max-requests-per-ip: ${CODE_MAX_REQUESTS_PER_IP:20}
    ip-window: PT1H

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Un corte del SMTP no debe marcar la API como caída
    mail:
      enabled: false
