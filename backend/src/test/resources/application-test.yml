# Solo para pruebas. La base la entrega Testcontainers; este secreto no se usa fuera de las pruebas.
spring:
  datasource:
    url: jdbc:postgresql://placeholder/test
    username: test
    password: test
  mail:
    # No se conecta nunca: las pruebas reemplazan el remitente por RecordingEmailSender
    host: localhost

agrovet:
  jwt:
    secret: dGVzdC1zZWNyZXQtc29sby1wYXJhLXBydWViYXMtMDEyMzQ1Njc4OWFiY2RlZg==
  cors:
    allowed-origins: http://localhost:3000
  login-rate-limit:
    # MockMvc siempre usa 127.0.0.1: el límite por IP se prueba en LoginRateLimiterTest
    max-attempts-per-ip: 10000
  photos:
    storage-dir: ${java.io.tmpdir}/agrovet-test-photos
  mail:
    from: AgroVet <no-responder@agrovet.test>
    async: false
  email-codes:
    # Mismo motivo: el límite por IP se prueba en CodeRequestLimiterTest
    max-requests-per-ip: 10000
