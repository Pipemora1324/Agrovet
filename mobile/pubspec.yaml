name: agrovet
description: "AgroVet: alerta temprana de mastitis bovina, sin conexión."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  dio: ^5.11.1
  flutter_litert: ^3.9.4
  fl_chart: ^1.3.0
  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  mocktail: ^1.0.5
  crypto: ^3.0.6

# La base local usa SQLCipher (cifrada); el paquete sqlite3 descarga el binario verificado por sha256
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/model/
