name: ml

on:
  push:
    branches: [main, develop, "feature/ml-**"]
    paths: ["ml/**", ".github/workflows/ml.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["ml/**", ".github/workflows/ml.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: hashFiles('ml/requirements.txt') != ''
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Instalar dependencias
        if: hashFiles('ml/requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Lint
        if: hashFiles('ml/requirements.txt') != ''
        run: flake8 src tests

      - name: Pruebas
        if: hashFiles('ml/tests/**/*.py') != ''
        run: pytest -q

      - name: Sin código aún
        if: hashFiles('ml/requirements.txt') == ''
        run: echo "El módulo ml todavía no tiene código; nada que probar."
