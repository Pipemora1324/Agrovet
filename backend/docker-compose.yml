# Entorno local de desarrollo: PostgreSQL 15 + backend.
# Los valores salen de backend/.env (copiar desde .env.example).
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      # Solo accesible desde este equipo; cambie DB_HOST_PORT si ya tiene otro PostgreSQL en el 5432
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Buzón de prueba: recibe todos los correos del backend sin enviarlos a nadie.
  # Bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP, para el backend ejecutado fuera de Docker
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P14D}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Por defecto, Mailpit. Para correo real, defina SMTP_* en .env
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-AgroVet <no-responder@agrovet.local>}
      PHOTO_STORAGE_DIR: /app/data/photos
      # Asistente: sin clave queda apagado. La clave va solo en backend/.env, nunca en la app
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - photos:/app/data/photos
    ports:
      - "8080:8080"

volumes:
  pgdata:
  photos:
