name: backend

on:
  push:
    branches: [main, develop, "feature/backend-**"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: hashFiles('backend/pom.xml') != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers usa el Docker que ya trae el runner de Ubuntu
      - name: Compilar y probar
        if: hashFiles('backend/pom.xml') != ''
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Sin código aún
        if: hashFiles('backend/pom.xml') == ''
        run: echo "El módulo backend todavía no tiene código; nada que probar."
