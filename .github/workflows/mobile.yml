name: mobile

on:
  push:
    branches: [main, develop]
    paths: ["mobile/**", "ml/models/**", "ml/tests/fixtures/milk/**", "scripts/ci/**", ".github/workflows/mobile.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["mobile/**", "ml/models/**", "ml/tests/fixtures/milk/**", "scripts/ci/**", ".github/workflows/mobile.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: hashFiles('mobile/pubspec.yaml') != ''
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: hashFiles('mobile/pubspec.yaml') != ''
        with:
          # Versión fija, la misma del entorno de desarrollo: con "stable" sin versión el CI cambia
          # solo cuando sale una nueva (3.50 depreca package:flutter/material.dart y --fatal-infos
          # lo vuelve un fallo). Subir de versión es un cambio aparte, con su migración.
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dependencias
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter pub get --enforce-lockfile

      # Modo estricto (strict-casts, strict-inference, strict-raw-types) en analysis_options.yaml;
      # con --fatal-infos hasta una sugerencia rompe el build
      - name: Análisis estático estricto
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Pruebas con cobertura
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter test --coverage

      - name: Resumen de cobertura
        if: always() && hashFiles('mobile/coverage/lcov.info') != ''
        working-directory: .
        run: python3 scripts/ci/coverage_summary.py --lcov mobile/coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: APK por arquitectura
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter build apk --release --split-per-abi

      # Pensado para planes de datos limitados: ningún APK puede pasar de 15 MB
      - name: Tamaño de los APK
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: |
          limit=$((15 * 1024 * 1024))
          status=0
          echo "| APK | Tamaño (MB) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c %s "$apk")
            mb=$(awk "BEGIN { printf \"%.1f\", $size / 1048576 }")
            echo "$(basename "$apk"): $mb MB"
            echo "| $(basename "$apk") | $mb |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$(basename "$apk") pesa $mb MB y el límite es 15 MB"
              status=1
            fi
          done
          exit $status

      # El APK normal no lleva los modelos experimentales (solo se empaquetan con sus banderas)
      - name: APK normal sin modelos experimentales
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if unzip -l "$apk" | grep -E "milk_cnn|udder_cnn\.tflite"; then
            echo "::error::El APK normal no debe incluir el modelo de leche ni el de la ubre"
            exit 1
          fi

      # APK de demostración (DEMO_MODE + UDDER_TRIAGE): el que se reparte para mostrar la app sin
      # servidor. Lleva los dos modelos experimentales y debe seguir bajo el mismo límite.
      - name: APK de demostración (arm64)
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=DEMO_MODE=true --dart-define=UDDER_TRIAGE=true
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          for asset in milk_cnn.tflite milk_cnn_config.json udder_cnn.tflite; do
            unzip -l "$apk" | grep -q "assets/model/$asset" || { echo "::error::Falta $asset en el APK de demostración"; exit 1; }
          done
          size=$(stat -c %s "$apk")
          mb=$(awk "BEGIN { printf \"%.1f\", $size / 1048576 }")
          echo "| demo arm64 (DEMO_MODE + UDDER_TRIAGE) | $mb |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt $((15 * 1024 * 1024)) ]; then
            echo "::error::El APK de demostración pesa $mb MB y el límite es 15 MB"
            exit 1
          fi

      - name: Sin código aún
        if: hashFiles('mobile/pubspec.yaml') == ''
        run: echo "El módulo mobile todavía no tiene código; nada que probar."
