name: mobile

on:
  push:
    branches: [main, develop]
    paths: ["mobile/**", "ml/models/**", ".github/workflows/mobile.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["mobile/**", "ml/models/**", ".github/workflows/mobile.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: hashFiles('mobile/pubspec.yaml') != ''
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: hashFiles('mobile/pubspec.yaml') != ''
        with:
          channel: stable
          cache: true

      - name: Dependencias
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter pub get

      - name: Análisis estático
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter analyze

      - name: Pruebas
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter test

      - name: APK por arquitectura
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: flutter build apk --release --split-per-abi

      # Pensado para planes de datos limitados: ningún APK puede pasar de 15 MB
      - name: Tamaño de los APK
        if: hashFiles('mobile/pubspec.yaml') != ''
        run: |
          limit=$((15 * 1024 * 1024))
          status=0
          echo "| APK | Tamaño (MB) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c %s "$apk")
            mb=$(awk "BEGIN { printf \"%.1f\", $size / 1048576 }")
            echo "$(basename "$apk"): $mb MB"
            echo "| $(basename "$apk") | $mb |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$(basename "$apk") pesa $mb MB y el límite es 15 MB"
              status=1
            fi
          done
          exit $status

      - name: Sin código aún
        if: hashFiles('mobile/pubspec.yaml') == ''
        run: echo "El módulo mobile todavía no tiene código; nada que probar."
