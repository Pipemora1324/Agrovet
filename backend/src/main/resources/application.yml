# Todo lo sensible llega por variables de entorno (ver .env.example). No hay valores por defecto
# para credenciales ni para el secreto del JWT: si faltan, la aplicación no arranca.
spring:
  application:
    name: agrovet-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Un poco más que agrovet.photos.max-size, para que el mensaje claro lo dé la aplicación
      max-file-size: 6MB
      max-request-size: 6MB
  # Correo saliente (códigos de verificación y de recuperación). En desarrollo, Mailpit del docker-compose.
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  error:
    include-message: never
    include-stacktrace: never

agrovet:
  jwt:
    secret: ${JWT_SECRET}
    issuer: agrovet
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P14D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  login-rate-limit:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    window: ${LOGIN_WINDOW:PT5M}
    max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:30}
  mail:
    from: ${MAIL_FROM}
    # false solo en pruebas: el correo sale en el mismo hilo
    async: true
  photos:
    storage-dir: ${PHOTO_STORAGE_DIR}
    max-size: 5MB
    max-dimension: 6000
  email-codes:
    ttl: PT15M
    max-attempts: 5
    resend-cooldown: PT60S
    max-per-day: 10
    max-requests-per-ip: ${CODE_MAX_REQUESTS_PER_IP:20}
    ip-window: PT1H

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Un corte del SMTP no debe marcar la API como caída
    mail:
      enabled: false
